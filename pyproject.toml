[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minivectordb-ooc"
version = "3.3.0"
authors = [
  { name="Carlo Moro", email="cnmoro@gmail.com" },
]
description = "An out-of-core vector database with a built-in multilingual sentence encoder. The successor to minivectordb."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["vector database", "embeddings", "semantic search", "sentence encoder", "out-of-core"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "fast-universal-sentence-encoder>=0.2.0",
    "rapidfuzz>=3.0",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/cnmoro/MiniVectorDB"
"Bug Tracker" = "https://github.com/cnmoro/MiniVectorDB/issues"

[tool.setuptools.packages.find]
include = ["minivectordb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
